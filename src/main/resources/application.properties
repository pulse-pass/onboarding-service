spring.application.name=onboarding-service

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:onboarding}
spring.datasource.username=${MYSQL_USER:onboarding}
spring.datasource.password=${MYSQL_PASSWORD:onboarding}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true

app.internal-token=${INTERNAL_TOKEN}

spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=10s

app.keycloak.url=${KEYCLOAK_URL:}
app.keycloak.realm=${KEYCLOAK_REALM:pulse-pass}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:onboarding-service}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}

app.organization-service.url=${ORGANIZATION_SERVICE_URL:}
