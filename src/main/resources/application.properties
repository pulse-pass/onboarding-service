spring.application.name=onboarding-service

# Database
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:onboarding}
spring.datasource.username=${MYSQL_USER:onboarding}
spring.datasource.password=${MYSQL_PASSWORD:onboarding}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP (connection pool)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

# JSON
spring.jackson.property-naming-strategy=SNAKE_CASE

# Messages
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true

# Token sent to the services that expose /internal/* routes
app.internal-token=${INTERNAL_TOKEN}

# Timeouts of the outbound HTTP calls made by the gateways
app.http.connect-timeout=3s
app.http.read-timeout=10s

# Keycloak (URL selected by infrastructure/service-start.sh)
app.keycloak.url=${KEYCLOAK_URL:}
app.keycloak.realm=${KEYCLOAK_REALM:pulse-pass}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:onboarding-service}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}

# organization-service base URL (selected by infrastructure/service-start.sh)
app.organization-service.url=${ORGANIZATION_SERVICE_URL:}
