name: onboarding-service

services:
  onboarding-service-mysql:
    image: mysql:8.0
    container_name: onboarding-service-mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pulse-pass

  onboarding-service-mockserver:
    image: mockserver/mockserver:5.15.0
    profiles: [test]
    container_name: onboarding-service-mockserver
    ports:
      - "${MOCKSERVER_PORT}:1080"
    volumes:
      - ./MockServerHealthcheck.java:/healthcheck/MockServerHealthcheck.java:ro
    healthcheck:
      test: ["CMD", "java", "/healthcheck/MockServerHealthcheck.java"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    networks:
      - pulse-pass

  onboarding-service-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: onboarding-service-api
    env_file: .env
    environment:
      MYSQL_HOST: onboarding-service-mysql
      MYSQL_PORT: 3306
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      ORGANIZATION_SERVICE_URL: ${ORGANIZATION_SERVICE_URL}
    ports:
      - "${API_PORT}:8080"
    cap_add:
      - SYS_TIME
    depends_on:
      onboarding-service-mysql:
        condition: service_healthy
      onboarding-service-mockserver:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pulse-pass

networks:
  pulse-pass:
    external: true
